[package]
name = "oats-sources-macos"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.95"
description = "macOS audio producers: Core Audio's process objects (bundle id, pid, is-running-output). No TCC permission needed. Swappable like the engine and status crates."
publish = false

# NOT a workspace member (see the root Cargo.toml's `exclude`): the Core Audio calls are FFI,
# so this crate needs `unsafe`, which the workspace forbids. All of it sits in `src/macos.rs`
# behind a safe API; the rest of the workspace lints are mirrored here.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
oats-sources = { path = "../oats-sources" }
log = "0.4"

# the same objc2 0.3 bindings cpal already pulls in (no new crates in the tree)
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }
