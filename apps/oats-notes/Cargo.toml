[package]
name = "oats-notes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OatsNotes desktop app (eframe shell)"
publish = false

[lints]
workspace = true

[features]
default = ["selftest"]
# `--selftest out.png`: render the window offscreen (oats-ui's egui_kittest harness).
selftest = ["oats-ui/selftest"]

[dependencies]
oats-core = { workspace = true }
oats-brain = { workspace = true }
oats-audio = { workspace = true }
oats-engine-fluidaudio = { workspace = true }
oats-ui = { workspace = true }
oats-status = { workspace = true }
oats-status-macos = { workspace = true }
oats-media = { workspace = true }
# not a workspace member (Core Audio FFI needs `unsafe`); a no-op off macOS
oats-sources-macos = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "persistence", "wayland", "x11", "links"] }
egui = { workspace = true }
log = { workspace = true }
ctrlc = { workspace = true }
env_logger = { workspace = true }
image = { workspace = true }
